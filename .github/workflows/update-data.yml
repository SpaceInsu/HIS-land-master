name: 실거래가 문제집 갱신

on:
  schedule:
    - cron: "0 18,0,6,12 * * *"   # 하루 4번 (한국시간 3·9·15·21시) — 국토부가 멈춰 있으면 건너뛰고 다음에 재시도
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 국토부 실거래가 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_trades.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/questions.json
          git diff --cached --quiet || (git commit -m "실거래가 문제집 자동 갱신" && git push)
